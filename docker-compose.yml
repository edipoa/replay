services:
  replay-agent:
    build:
      context: .
      # Match the CPU architecture of your device:
      #   amd64  → PC, NUC, generic x86-64
      #   arm64  → Raspberry Pi 4 / 5, Jetson Nano
      args:
        TARGETARCH: amd64

    image: replay-agent:latest

    restart: unless-stopped

    # ── Environment ─────────────────────────────────────────────────────────
    # Secrets and per-site settings live in a .env file (never commit it).
    # Copy .env.example → .env and fill in the values.
    env_file:
      - .env
    environment:
      # Paths inside the container — must match the volume targets below.
      # Camera 1 (backward-compatible alias — same as REPLAY_CAM_1_BUFFER_DIR)
      REPLAY_BUFFER_DIR:         /tmp/replay_buffer_1
      # Uncomment and set REPLAY_CAM_2_RTSP_URL in .env to enable second camera:
      # REPLAY_CAM_2_BUFFER_DIR: /tmp/replay_buffer_2
      REPLAY_OUTPUT_DIR:         /tmp/replays
      REPLAY_AGENDA_PATH:        /etc/replay/agenda.json
      REPLAY_JOYSTICK_ID:        0
      REPLAY_WATERMARK_PATH:     /etc/replay/watermark.png

    # ── Volumes ──────────────────────────────────────────────────────────────
    volumes:
      # Rolling segment buffers — tmpfs so segments never hit the SSD.
      # Add a second block (targeting /tmp/replay_buffer_2) when using cam2.
      - type: tmpfs
        target: /tmp/replay_buffer_1
        tmpfs:
          size: 524288000   # 500 MiB ≈ 4 min of 1080p @ 500 kbps
      # Uncomment to enable second camera buffer:
      # - type: tmpfs
      #   target: /tmp/replay_buffer_2
      #   tmpfs:
      #     size: 524288000

      # Finished .mp4 replays persisted on the host so they survive restarts
      # and can be inspected or re-uploaded manually.
      - replay_output:/tmp/replays

      # Schedule file: read-only mount so it can be updated on the host
      # (changes take effect on the next button press, no rebuild needed).
      - ./agenda.json:/etc/replay/agenda.json:ro

      # Watermark PNG burned into every replay clip.
      - ./faz-o-clip-watermark-220.png:/etc/replay/watermark.png:ro

    # ── Input devices ─────────────────────────────────────────────────────────
    # Pass the USB arcade encoder through to the container.
    # To find the right event number: `ls -l /dev/input/by-id/` on the host.
    devices:
      - /dev/input/js0:/dev/input/js0

    # Add the host's "input" group so the process can open /dev/input/js0
    # without running as root. Check the GID with: `getent group input`
    group_add:
      - "999"

    # ── Logging ──────────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ── Top-level named volumes ───────────────────────────────────────────────────
volumes:
  replay_output:
    # Stored under /var/lib/docker/volumes/replay_output/_data on the host.
    # To list finished clips:
    #   docker run --rm -v replay_output:/out alpine ls -lh /out
